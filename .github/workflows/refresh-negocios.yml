# Regenera las páginas públicas de los negocios (y el índice) cada hora, así un negocio nuevo
# tiene su enlace funcionando enseguida. También se puede correr a mano desde la pestaña Actions.
# Usa solo datos públicos de la app (clave anónima de Supabase, la misma que lleva la app).
name: Actualizar páginas de negocios

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-negocios
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Generar páginas de negocios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-web.mjs . --businesses-only

      - name: Publicar si hubo cambios
        run: |
          git config user.name "activa-local-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A negocio index.html
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática de páginas de negocios"
            git push
          fi
